name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32v1-none }
      - name: Install stellar-cli
        uses: actions/cache@v4
        id: cli
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-28.0.0
      - if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version 28.0.0
      - run: stellar contract build --package subscriptions
      - run: |
          cp target/wasm32v1-none/release/subscriptions.wasm .
          sha256sum subscriptions.wasm > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            subscriptions.wasm
            SHA256SUMS
          generate_release_notes: true
